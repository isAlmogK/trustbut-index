name: collect
# One click: collect a manifest (pilot or full), commit it, start every run batch.
# The INDEX_GH_TOKEN secret is a read-only fine-grained token (public repos). It is used only by the collect step,
# which runs this repo's own code, never a studied repo's code.
on:
  workflow_dispatch:
    inputs:
      pilot:
        description: Pilot run (20 PRs per agent, manifest pilot-<until>)
        type: boolean
        default: true
      until:
        description: Last merge date YYYY-MM-DD (empty = today, UTC)
        required: false
        default: ''
      days:
        description: Window length in days
        required: false
        default: '90'
      exclude:
        description: Comma-separated manifests to exclude (e.g. the pilot manifest for the full run)
        required: false
        default: ''
permissions: {}
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write   # commit the manifest
      actions: write    # start run.yml batches
    steps:
      - name: Require main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "::error::Run collect from main"; exit 1; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - name: Resolve and validate inputs
        env:
          PILOT: ${{ inputs.pilot }}
          UNTIL_IN: ${{ inputs.until }}
          DAYS: ${{ inputs.days }}
        run: |
          UNTIL="${UNTIL_IN:-$(date -u +%F)}"
          if ! [[ "$UNTIL" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::until must be YYYY-MM-DD"; exit 1
          fi
          if ! [[ "$DAYS" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::days must be a positive integer"; exit 1
          fi
          if [ "$PILOT" = "true" ]; then NAME="pilot-$UNTIL"; else NAME="$UNTIL"; fi
          echo "UNTIL=$UNTIL" >> "$GITHUB_ENV"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
      # One cache per run; a rerun with the same until restores the newest one, so a failed or timed-out run resumes.
      - name: Restore the API cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: cache/github
          key: github-api-${{ env.UNTIL }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: github-api-${{ env.UNTIL }}-
      - name: Check the token secret
        env:
          GITHUB_TOKEN: ${{ secrets.INDEX_GH_TOKEN }}
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then echo "::error::Add the INDEX_GH_TOKEN secret (see README)"; exit 1; fi
      - name: Collect
        timeout-minutes: 320
        env:
          GITHUB_TOKEN: ${{ secrets.INDEX_GH_TOKEN }}
          PILOT: ${{ inputs.pilot }}
          DAYS: ${{ inputs.days }}
          EXCLUDE: ${{ inputs.exclude }}
        run: |
          args=(collect --until "$UNTIL" --days "$DAYS")
          if [ "$PILOT" = "true" ]; then args+=(--pilot); fi
          if [ -n "$EXCLUDE" ]; then args+=(--exclude-manifest "$EXCLUDE"); fi
          npx tsx src/cli.ts "${args[@]}"
      - name: Save the API cache
        if: always() && env.UNTIL != ''
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: cache/github
          key: github-api-${{ env.UNTIL }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Commit the manifest
        run: |
          git config user.name "trustbut-index"
          git config user.email "actions@users.noreply.github.com"
          git add "manifests/$NAME.jsonl" "manifests/$NAME.summary.json"
          git diff --cached --quiet && exit 0
          git commit -m "data: manifest $NAME"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep "$((attempt * 5))"
          done
          exit 1
      - name: Start the run batches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MANIFEST="manifests/$NAME.jsonl"
          N=$(grep -c . "$MANIFEST" || true)
          if [ "${N:-0}" -eq 0 ]; then
            echo "::warning::$MANIFEST has no PRs; no batches started"
            exit 0
          fi
          LAST=$(( (N - 1) / 250 ))
          for b in $(seq 0 "$LAST"); do
            gh workflow run run.yml --ref main -f manifest="$MANIFEST" -f batch="$b" -f date="$NAME"
          done
          {
            echo "## collect $NAME"
            echo
            echo "Manifest: \`$MANIFEST\` ($N PRs). Batches started: $((LAST + 1)) (run.yml, batches 0 to $LAST)."
            echo
            echo '```json'
            node -e 'const s=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); console.log(JSON.stringify({selected:s.selected,humansSelected:s.humansSelected,humanShortfall:s.humanShortfall,insufficient:s.insufficient,window:s.window},null,2))' "manifests/$NAME.summary.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
